      FLOWER_POSITION: "petal-5:position-6"
      XYO_ANCHOR_DEVICE: "cook-6"
      DEVICE_CLASS: "altair"
    ports:
      - "5045:5000"
    networks:
      - engine_network
    depends_on:
      operator-sovereign:
        condition: service_healthy
    volumes:
      - cook6_state:/app/state
    user: "1000:1000"
    restart: unless-stopped

  # ============================================================================
  # PETAL 6 (6 engines) - Identity & Routing Planes
  # ============================================================================

  identity-gateway:
    build:
      context: ./containers
      dockerfile: Dockerfile.engine-base
    container_name: identity-gateway-petal6-1
    image: engine2/identity:latest
    environment:
      ENGINE_NAME: "Identity-Gateway"
      ENGINE_PLANE: "identity"
      ENGINE_TYPE: "identity"
      ENGINE_ROLE: "gateway"
      FLOWER_POSITION: "petal-6:position-1"
      IDENTITY_SCRIPTS: "hiragana:katakana:kanji:maori:fijian"
      XYO_ANCHOR_DEVICE: "identity-gateway"
    ports:
      - "5050:5000"
    networks:
      - identity_network
    depends_on:
      operator-sovereign:
        condition: service_healthy
    volumes:
      - identity_state:/app/state
    user: "1000:1000"
    restart: unless-stopped

  routing-dnssec:
    build:
      context: ./containers
      dockerfile: Dockerfile.engine-base
    container_name: routing-dnssec-petal6-2
    image: engine2/routing:latest
    environment:
      ENGINE_NAME: "Routing-DNSSEC"
      ENGINE_PLANE: "routing"
      ENGINE_TYPE: "routing"
      ENGINE_ROLE: "dnssec"
      FLOWER_POSITION: "petal-6:position-2"
      DNS_MODE: "dnssec"
      PUBLIC_DOMAIN: "robdoe.com"
      PRIVATE_DOMAIN: "robertdoe.pw"
      XYO_ANCHOR_DEVICE: "routing-dnssec"
    ports:
      - "5051:5000"
      - "53:53/udp"
    networks:
      - routing_network
    depends_on:
      operator-sovereign:
        condition: service_healthy
    volumes:
      - routing_state:/app/state
    user: "1000:1000"
    restart: unless-stopped

  routing-zerotrust:
    build:
      context: ./containers
      dockerfile: Dockerfile.engine-base
    container_name: routing-zerotrust-petal6-3
    image: engine2/routing:latest
    environment:
      ENGINE_NAME: "Routing-ZeroTrust"
      ENGINE_PLANE: "routing"
      ENGINE_TYPE: "routing"
      ENGINE_ROLE: "zerotrust"
      FLOWER_POSITION: "petal-6:position-3"
      ZEROTRUST_ENABLED: "true"
      XYO_ANCHOR_DEVICE: "routing-zerotrust"
    ports:
      - "5052:5000"
    networks:
      - routing_network
    depends_on:
      operator-sovereign:
        condition: service_healthy
    volumes:
      - routing_state:/app/state
    user: "1000:1000"
    restart: unless-stopped

  routing-cloudflare:
    build:
      context: ./containers
      dockerfile: Dockerfile.engine-base
    container_name: routing-cloudflare-petal6-4
    image: engine2/routing:latest
    environment:
      ENGINE_NAME: "Routing-Cloudflare"
      ENGINE_PLANE: "routing"
      ENGINE_TYPE: "routing"
      ENGINE_ROLE: "cloudflare"
      FLOWER_POSITION: "petal-6:position-4"
      CLOUDFLARE_TUNNEL_ENABLED: "true"
      XYO_ANCHOR_DEVICE: "routing-cloudflare"
    ports:
      - "5053:5000"
    networks:
      - routing_network
    depends_on:
      operator-sovereign:
        condition: service_healthy
    volumes:
      - routing_state:/app/state
    user: "1000:1000"
    restart: unless-stopped

  pulse-timing:
    build:
      context: ./containers
      dockerfile: Dockerfile.engine-base
    container_name: pulse-timing-petal6-5
    image: engine2/pulse:latest
    environment:
      ENGINE_NAME: "Pulse-Timing"
      ENGINE_PLANE: "pulse"
      ENGINE_TYPE: "pulse"
      FLOWER_POSITION: "petal-6:position-5"
      PULSE_UI: "0.02"
      PULSE_TACTILE: "0.05"
      PULSE_WEARABLE: "0.075"
      PULSE_NETWORK: "0.15"
      XYO_ANCHOR_DEVICE: "pulse-timing"
    ports:
      - "5054:5000"
    networks:
      - engine_network
    depends_on:
      operator-sovereign:
        condition: service_healthy
    volumes:
      - pulse_state:/app/state
    user: "1000:1000"
    restart: unless-stopped

  audit-trail:
    build:
      context: ./containers
      dockerfile: Dockerfile.engine-base
    container_name: audit-trail-petal6-6
    image: engine2/audit:latest
    environment:
      ENGINE_NAME: "Audit-Trail"
      ENGINE_PLANE: "operator"
      ENGINE_TYPE: "audit"
      FLOWER_POSITION: "petal-6:position-6"
      AUDIT_LOG_LEVEL: "info"
      XYO_ANCHOR_DEVICE: "audit-trail"
    ports:
