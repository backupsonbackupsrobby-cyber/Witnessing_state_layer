version: '3.9'

networks:
  engine_network:
    driver: bridge
  identity_network:
    driver: bridge
  routing_network:
    driver: bridge

# Flower of Life Orchestration: 1 Center + 6 Petals (6 engines each = 43 total)
services:
  # ============================================================================
  # CENTER FLOWER (1 engine) - Operator Plane & XYO State Anchor
  # ============================================================================
  
  operator-sovereign:
    build:
      context: ./containers
      dockerfile: Dockerfile.engine-base
    container_name: operator-sovereign-center
    image: engine2/operator:latest
    environment:
      ENGINE_NAME: "Operator-Sovereign"
      ENGINE_ROLE: "sovereign"
      ENGINE_CYCLE: "truth:boundaries:allowed-states"
      FLOWER_POSITION: "center"
      XYO_ANCHOR_ENABLED: "true"
      XYO_ANCHOR_DEVICE: "center"
    ports:
      - "5000:5000"
    networks:
      - engine_network
      - identity_network
      - routing_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 10s
    volumes:
      - operator_state:/app/state
      - operator_logs:/app/logs
    user: "1000:1000"
    restart: unless-stopped

  # ============================================================================
  # PETAL 1 (6 engines) - Tesla Engine (Motion & Energy)
  # ============================================================================
  
  tesla-engine-1:
    build:
      context: ./containers
      dockerfile: Dockerfile.engine-base
    container_name: tesla-engine-petal1-1
    image: engine2/tesla:latest
    environment:
      ENGINE_NAME: "Tesla-1"
      ENGINE_PLANE: "engine"
      ENGINE_TYPE: "tesla"
      ENGINE_SUBTYPE: "motion"
      FLOWER_POSITION: "petal-1:position-1"
      XYO_ANCHOR_DEVICE: "tesla-1"
      DEVICE_CLASS: "matariki"
    ports:
      - "5001:5000"
    networks:
      - engine_network
    depends_on:
      operator-sovereign:
        condition: service_healthy
    volumes:
      - tesla1_state:/app/state
    user: "1000:1000"
    restart: unless-stopped

  tesla-engine-2:
